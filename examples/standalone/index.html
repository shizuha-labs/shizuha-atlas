<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="An offline Atlas architecture viewer with a fictional example system. No server or account required." />
    <title>Atlas · Offline viewer demo</title>
    <link rel="stylesheet" href="./app.css" />
    <style>
      html, body { margin: 0; background: #08111f; color: #e4edf9; font-family: system-ui, sans-serif; }
      .standalone-shell { display: flex; flex-direction: column; height: 100dvh; }
      .standalone-shell .atlas-app { flex: 1; --atlas-height: auto; --atlas-min-height: 560px; }
      .standalone-notice { padding: 12px 24px; border-bottom: 1px solid #294963; background: #12243a; font-size: 12px; line-height: 1.5; }
      .standalone-notice strong { color: #7dd3fc; }
      .standalone-notice p { margin: 2px 0 0; color: #b2c3d8; }
      .standalone-notice [role="status"] { color: #c4e9fa; }
    </style>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This offline Atlas viewer needs JavaScript enabled. No internet connection or server is required.</noscript>
  </body>
</html>
